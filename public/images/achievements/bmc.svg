<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-bmc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a14"/>
      <stop offset="50%" stop-color="#0a251e"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid-bmc" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(52, 211, 153, 0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg-bmc)"/>
  <rect width="800" height="500" fill="url(#grid-bmc)"/>
  <circle cx="400" cy="210" r="140" fill="none" stroke="url(#emerald)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>
  <circle cx="400" cy="210" r="100" fill="rgba(5, 150, 105, 0.1)"/>

  <!-- Hospital / Cross Telemetry Icon -->
  <g transform="translate(365, 165) scale(1.6)" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect width="16" height="20" x="4" y="2" rx="2" ry="2"/>
    <path d="M9 22v-4h6v4"/>
    <path d="M8 6h.01"/>
    <path d="M16 6h.01"/>
    <path d="M8 10h.01"/>
    <path d="M16 10h.01"/>
    <path d="M12 6v4"/>
    <path d="M10 8h4"/>
  </g>

  <!-- Typography -->
  <text x="400" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#34d399" letter-spacing="4" text-anchor="middle">BICOL MEDICAL CENTER (BMC)</text>
  <text x="400" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">INSTITUTIONAL PARTNERSHIP</text>
  <text x="400" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.5" text-anchor="middle">Largest Blood Bank Provider in Camarines Sur &amp; Camarines Norte</text>

  <rect x="250" y="445" width="300" height="28" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
  <text x="400" y="463" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">REPLACE WITH: public/images/achievements/bmc.jpg</text>
