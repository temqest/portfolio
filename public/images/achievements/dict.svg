<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a122a"/>
      <stop offset="50%" stop-color="#0f2638"/>
      <stop offset="100%" stop-color="#143048"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="400" cy="210" r="140" fill="none" stroke="url(#teal)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="400" cy="210" r="100" fill="rgba(13, 148, 136, 0.08)"/>

  <!-- Award Graphic -->
  <g transform="translate(365, 160) scale(1.6)" stroke="#2dd4bf" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="7"/>
    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
  </g>

  <!-- Typography -->
  <text x="400" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" letter-spacing="4" text-anchor="middle">DICT PHILIPPINE STARTUP CHALLENGE</text>
  <text x="400" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">3RD RUNNER UP (REGIONAL)</text>
  <text x="400" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.5" text-anchor="middle">UNITE · Dept. of Information &amp; Communications Technology</text>
</svg>